<!DOCTYPE html>

<style>

  #install-hint button { flex: none; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.12); color: #dff2ff; font-size: 18px; line-height: 1; }
  #name-overlay .name-card { width: min(88vw, 440px); box-sizing: border-box; padding: 22px; border: 1px solid rgba(110, 200, 255, 0.35); border-radius: 20px; background: #0b1730; box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55); text-align: left; }
  #name-overlay .name-title { font-size: 26px; font-weight: 800; text-align: center; color: #eaf7ff; }
  #name-overlay .name-sub { margin-top: 6px; font-size: 14px; text-align: center; color: rgba(180, 215, 255, 0.7); }

  #name-overlay #name-input { display: block; width: 100%; box-sizing: border-box; margin-top: 14px; padding: 12px 14px; border: 1.5px solid rgba(120, 200, 255, 0.5); border-radius: 12px; background: rgba(0, 0, 0, 0.28); color: #ffffff; font-size: 22px; outline: none; -webkit-appearance: none; }
  #name-overlay #name-input:focus { border-color: #7fe0ff; box-shadow: 0 0 0 3px rgba(80, 180, 255, 0.2); }
  #name-overlay .name-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 16px; }
  #name-overlay .name-btn { border: 0; border-radius: 999px; padding: 11px 24px; font-size: 16px; font-weight: 700; color: #062038; background: linear-gradient(135deg, #7fe0ff, #3f9bff); -webkit-appearance: none; }
  #name-overlay .name-btn.ghost { border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.1); color: #dff2ff; }
</style>
</head>
<body>

<div id="rotate" class="overlay">
  <div style="font-size: 64px; line-height: 1; margin-bottom: 12px;">↻</div>
  <div class="big">请把 iPad 竖过来</div>
  <div class="sub">这个弹球台是 9:16 竖屏的，竖着拿更好玩</div>
  <button id="rotate-close" type="button">仍然继续</button>
</div>
<div id="name-overlay" class="overlay">
  <div class="name-card">
    <div class="name-title">谁在玩？</div>
    <div class="name-sub">同一个 iPad 上，每个人一个名字</div>
    <div id="name-list" class="name-list"></div>
    <input id="name-input" type="text" maxlength="8" placeholder="输入名字（最多 8 个字）" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    <div class="name-actions">
      <button id="name-cancel" class="name-btn ghost" type="button">取消</button>
      <button id="name-ok" class="name-btn" type="button">确定</button>
    </div>
  </div>
</div>
<div id="install-hint">
  <span>点「分享」→「添加到主屏幕」，就能像 App 一样玩</span>
  <button id="install-close" type="button" aria-label="关闭">×</button>
</div>

    r = Math.min(r, w / 2, h / 2);

    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);

  }
  function starPath(c, x, y, r, rot) {
    c.beginPath();
    for (var i = 0; i < 10; i++) {
      var rad = (i % 2 === 0) ? r : r * 0.45;
      var a = rot - Math.PI / 2 + i * Math.PI / 5;
      var px = x + Math.cos(a) * rad;
      var py = y + Math.sin(a) * rad;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);

  }

    canvas.height = Math.round(viewH * dpr);

  ];

  function pipeAt(t) {
    var mt = 1 - t;
    var a = mt * mt * mt, b = 3 * mt * mt * t, c = 3 * mt * t * t, d = t * t * t;
    return {
      x: a * PIPE[0].x + b * PIPE[1].x + c * PIPE[2].x + d * PIPE[3].x,
      y: a * PIPE[0].y + b * PIPE[1].y + c * PIPE[2].y + d * PIPE[3].y
    };
  }
  function pipeTan(t) {
    var mt = 1 - t;
    var a = 3 * mt * mt, b = 6 * mt * t, c = 3 * t * t;
    var x = a * (PIPE[1].x - PIPE[0].x) + b * (PIPE[2].x - PIPE[1].x) + c * (PIPE[3].x - PIPE[2].x);
    var y = a * (PIPE[1].y - PIPE[0].y) + b * (PIPE[2].y - PIPE[1].y) + c * (PIPE[3].y - PIPE[2].y);
    var l = Math.hypot(x, y) || 1;
    return { x: x / l, y: y / l };
  }
  var pipeLen = 0, pipeSamples = [];
  (function () {
    var N = 80, prev = pipeAt(0), total = 0;
    pipeSamples.push({ t: 0, len: 0 });
    for (var i = 1; i <= N; i++) {
      var p = pipeAt(i / N);
      total += Math.hypot(p.x - prev.x, p.y - prev.y);
      pipeSamples.push({ t: i / N, len: total });
      prev = p;
    }
    pipeLen = total;
  })();
  function pipeAtArc(u) {
    var target = clamp(u, 0, 1) * pipeLen;
    for (var i = 1; i < pipeSamples.length; i++) {
      if (pipeSamples[i].len >= target) {
        var a = pipeSamples[i - 1], b = pipeSamples[i];
        var t = a.t + (b.t - a.t) * ((target - a.len) / Math.max(0.0001, b.len - a.len));
        return pipeAt(t);
      }
    }
    return pipeAt(1);

  var FACTS = {

  function bestKey(d) { return 'spacePinball.best.' + d; }
  function getBest(d) {
    try { return parseInt(localStorage.getItem(bestKey(d)) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function setBest(d, v) {
    try { localStorage.setItem(bestKey(d), String(v)); } catch (e) {}
  }
  for (var bi = 0; bi < 3; bi++) bests[bi] = getBest(bi);

  /* ================= 积分记录 ================= */
  var scoreHistory = [], totalScore = 0;
  function loadHistory() {
    try {
      var raw = localStorage.getItem('spacePinball.history');
      if (raw) {
        var arr = JSON.parse(raw);
        if (arr && arr.length) {
          scoreHistory = arr.slice(0, 8).filter(function (e) {
            return e && typeof e.score === 'number' && typeof e.diff === 'number';
          });
        }
      }
      totalScore = parseInt(localStorage.getItem('spacePinball.total') || '0', 10) || 0;
    } catch (e) { scoreHistory = []; totalScore = 0; }
  }
  function saveHistory() {
    try {
      localStorage.setItem('spacePinball.history', JSON.stringify(scoreHistory.slice(0, 8)));
      localStorage.setItem('spacePinball.total', String(totalScore));
    } catch (e) {}
  }
  loadHistory();

      if (raw) {
        var arr = JSON.parse(raw);
        if (arr && arr.length) {
          players = arr.filter(function (p) {

          }).slice(0, 20);

      }

    } catch (e) { players = []; familyTotal = 0; playerName = ''; }
    for (var i = 0; i < players.length; i++) {

    var sp2 = Math.hypot(ball.vx, ball.vy);

  /* ================= 更新 ================= */
  function update(dt) {
    var i;
    for (i = 0; i < ORBITERS.length; i++) {
      var o = ORBITERS[i];
      o.angle += o.speed * dt;
      if (o.angle > TAU) o.angle -= TAU;
      o.cool = Math.max(0, o.cool - dt);
      o.glow = Math.max(0, o.glow - dt * 2.6);
    }
    moon.angle += moon.speed * dt;
    if (moon.angle > TAU) moon.angle -= TAU;
    moon.cool = Math.max(0, moon.cool - dt);
    moon.glow = Math.max(0, moon.glow - dt * 2.6);
    sat.angle += sat.speed * dt;
    if (sat.angle > TAU) sat.angle -= TAU;
    sat.cool = Math.max(0, sat.cool - dt);
    sat.glow = Math.max(0, sat.glow - dt * 2.6);
    voyager.x += voyager.vx * dt;
    if (voyager.x > W + 70) voyager.x = -70;
    voyager.cool = Math.max(0, voyager.cool - dt);
    voyager.glow = Math.max(0, voyager.glow - dt * 2.6);
    alien.x += alien.vx * dt;
    if (alien.x < 380) { alien.x = 380; alien.vx = Math.abs(alien.vx); }
    if (alien.x > 560) { alien.x = 560; alien.vx = -Math.abs(alien.vx); }
    alien.phase += dt;
    alien.cool = Math.max(0, alien.cool - dt);
    alien.glow = Math.max(0, alien.glow - dt * 2.6);
    alien2.x += alien2.vx * dt;
    if (alien2.x < 180) { alien2.x = 180; alien2.vx = Math.abs(alien2.vx); }
    if (alien2.x > 330) { alien2.x = 330; alien2.vx = -Math.abs(alien2.vx); }
    alien2.phase += dt;
    alien2.cool = Math.max(0, alien2.cool - dt);
    alien2.glow = Math.max(0, alien2.glow - dt * 2.6);
    SUN.cool = Math.max(0, SUN.cool - dt);
    SUN.glow = Math.max(0, SUN.glow - dt * 2.2);

    for (i = meteors.length - 1; i >= 0; i--) {
      var mm = meteors[i];
      mm.x += mm.vx * dt; mm.y += mm.vy * dt;
      mm.cool = Math.max(0, mm.cool - dt);
      if (mm.x < -60 || mm.x > W + 60 || mm.y < 80 || mm.y > 760) meteors.splice(i, 1);
    }
    meteorTimer -= dt;
    if (meteorTimer <= 0 && state === 'playing') {
      meteorTimer = rand(3.5, 6.5);
      var fromLeft = Math.random() < 0.5;
      meteors.push({
        x: fromLeft ? -30 : W + 30,
        y: rand(150, 700),
        vx: (fromLeft ? 1 : -1) * rand(180, 280),
        vy: rand(-40, 40),
        r: 9, cool: 0, glow: 0
      });
    }
    for (i = 0; i < springs.length; i++) { springs[i].cool = Math.max(0, springs[i].cool - dt); springs[i].glow = Math.max(0, springs[i].glow - dt * 3.2); }
    for (i = 0; i < belt.rocks.length; i++) { belt.rocks[i].cool = Math.max(0, belt.rocks[i].cool - dt); belt.rocks[i].glow = Math.max(0, belt.rocks[i].glow - dt * 2.6); }
    if (cardT > 0) cardT -= dt;
    if (launchHintT > 0) launchHintT -= dt;
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; comboCelebrated = false; } }
    if (celebrateCd > 0) celebrateCd -= dt;
    if (lightT > 0) lightT -= dt;
    if (scorePop > 0) scorePop -= dt;
    if (cheerT > 0) cheerT -= dt;
    if (padToastT > 0) padToastT -= dt;

    if (state === 'quiz') {
      if (quizFeedback !== 0) {
        quizNextT -= dt;
        if (quizNextT <= 0) {
          if (quizFeedback === 2) { quizFeedback = 0; toOver(); }
          else if (quizIndex >= 2) { quizFeedback = 0; quizSuccess(); }
          else { quizFeedback = 0; quizIndex++; quizSel = 0; }
        }
      }
    } else if (state === 'ready') {
      readyTimer += dt;
      if (charging) {
        chargeTime += dt;
        charge = Math.min(1, chargeTime / 3);
      }
    } else if (state === 'launching') {
      launchT += dt / launchDur;
      if (launchT >= 1) { launchT = 1; finishLaunch(); }
      else {
        var pp = pipeAtArc(launchT);
        ball.x = pp.x; ball.y = pp.y;
        ball.trail.push({ x: pp.x, y: pp.y });
        if (ball.trail.length > 16) ball.trail.shift();
      }
    } else if (state === 'playing') {
      flippers[0].pressed = input.left;
      flippers[1].pressed = input.right;
      var steps = clamp(Math.ceil(dt / 0.008), 1, 8);
      var h = dt / steps;
      for (i = 0; i < steps; i++) physics(h);

      if (ball.active) {
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 18) ball.trail.shift();
        var speed = Math.hypot(ball.vx, ball.vy);
        if (speed < 26) ball.stuck += dt; else ball.stuck = 0;
        if (ball.stuck > 2.6) {
          ball.stuck = 0;
          if (ball.y < 800) { ball.vy = -380; ball.vx = rand(-200, 200); burst(ball.x, ball.y, '#9fd8ff', 8, 150); }
          else { ball.vy = 200; ball.vx += rand(-50, 50); }
        }
      } else {
        ball.trail.length = 0;
        respawnTimer -= dt;
        if (respawnTimer <= 0) { if (lives > 0) toReady(); else if (!quizUsed) startQuiz(); else toOver(); }
      }
    }

    for (var i2 = particles.length - 1; i2 >= 0; i2--) {
      var p = particles[i2];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i2, 1); continue; }
      p.vy += 520 * dt;
      p.vx *= (1 - 0.7 * dt); p.vy *= (1 - 0.7 * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (var i3 = floaters.length - 1; i3 >= 0; i3--) {
      floaters[i3].life -= dt;
      if (floaters[i3].life <= 0) floaters.splice(i3, 1);
    }
  }

  function drawSolar() {
    var i;
    for (i = 0; i < ORBITERS.length; i++) {
      var oo = ORBITERS[i];

        var aa = 0.7 + ai2 * 2.1;
        var ax = SUN.x + Math.cos(aa) * oo.a;
        var ay = SUN.y + cc + Math.sin(aa) * oo.b;
        var tang = Math.atan2(oo.b * Math.cos(aa), -oo.a * Math.sin(aa));
        ctx.save();
        ctx.translate(ax, ay); ctx.rotate(tang);
        ctx.strokeStyle = 'rgba(160,210,255,0.22)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(0, 0); ctx.lineTo(-3, 3); ctx.stroke();
        ctx.restore();

    ctx.strokeStyle = 'rgba(120,180,255,0.07)';

    ctx.save();

    sg.addColorStop(0, '#fffdf0'); sg.addColorStop(0.4, '#ffe066'); sg.addColorStop(0.8, '#ff9a2e'); sg.addColorStop(1, '#ff6a00');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r * pulse, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.35 + 0.15 * Math.sin(time * 3);
    ctx.strokeStyle = '#ffcf66'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r + 8, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;

      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(SUN.x, SUN.y, SUN.r + 10 + (1 - SUN.glow) * 20, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    ctx.save();
    ctx.font = '15px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,225,160,0.7)';
    ctx.fillText('太阳', SUN.x, SUN.y + SUN.r + 18);
    ctx.restore();

    for (i = 0; i < 3; i++) {
      var a0 = -0.6 + i * 1.8 + Math.sin(time * 0.7 + i) * 0.2;
      var a1 = a0 + 0.35 + 0.1 * Math.sin(time * 1.1 + i);

    }
    for (i = 0; i < 22; i++) {

    ctx.fillStyle = 'rgba(8,20,52,0.9)';

    ctx.strokeStyle = 'rgba(120,210,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 24px ' + FONT;
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText(card.name, 360, 140);
    ctx.font = '500 17px ' + FONT;
    ctx.fillStyle = '#dff2ff';
    ctx.fillText(card.text, 360, 171);
    ctx.font = '400 13px ' + FONT;
    ctx.fillStyle = 'rgba(160,200,240,0.7)';
    ctx.fillText('真实太阳系比这里大得多', 360, 197);
    ctx.restore();
  }

  function drawProgress() {
    if (state === 'menu') return;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 20px ' + FONT;
    ctx.fillStyle = 'rgba(160,210,255,0.85)';
    ctx.fillText('太空小知识 ' + knownCount + '/14', 360, 1240);
    ctx.restore();
  }

  function drawSideDecor() {
    ctx.save();
    ctx.fillStyle = 'rgba(8,20,45,0.9)';
    rr(ctx, 40, 1040, 110, 150, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(100,190,255,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 12px ' + FONT;
    ctx.fillStyle = 'rgba(190,225,255,0.9)';
    ctx.fillText('太空笔记', 95, 1055);
    if (lastFact) {
      ctx.font = '700 16px ' + FONT;
      ctx.fillStyle = '#ffe9a8';
      ctx.fillText(lastFact.name, 95, 1075);
      ctx.font = '500 12px ' + FONT;
      ctx.fillStyle = 'rgba(225,242,255,0.95)';
      var chars = lastFact.text.split('');
      var line = '', lines = [];
      for (var wi = 0; wi < chars.length; wi++) {
        var test = line + chars[wi];
        if (ctx.measureText(test).width > 100) { lines.push(line); line = chars[wi]; }
        else line = test;
      }
      lines.push(line);
      for (var li = 0; li < lines.length && li < 4; li++) ctx.fillText(lines[li], 95, 1094 + li * 14);
    } else {
      ctx.font = '500 12px ' + FONT;
      ctx.fillStyle = 'rgba(170,210,245,0.7)';
      ctx.fillText('撞到天体，', 95, 1086);
      ctx.fillText('这里会记住它', 95, 1102);
    }
    for (var ii = 0; ii < 14; ii++) {
      var cx2 = 47 + ii * 7.5;
      var cy2 = 1150;
      var on2 = !!known[FACT_KEYS[ii]];
      ctx.fillStyle = on2 ? FACT_COLORS[ii] : 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(cx2, cy2, 2.6, 0, TAU); ctx.fill();
    }
    ctx.font = '600 10px ' + FONT;
    ctx.fillStyle = 'rgba(170,215,255,0.85)';
    ctx.fillText('已认识 ' + knownCount + '/14', 95, 1170);
    ctx.restore();

    ctx.save();
    ctx.fillStyle = 'rgba(8,20,45,0.9)';
    rr(ctx, 550, 1040, 100, 150, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(100,190,255,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 12px ' + FONT;
    ctx.fillStyle = 'rgba(190,225,255,0.9)';
    ctx.fillText('观测台', 600, 1055);

    ctx.save();
    ctx.translate(572, 1082);
    ctx.fillStyle = '#ffe9a8';
    ctx.strokeStyle = '#5a4318'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(8,20,45,0.95)';
    ctx.beginPath(); ctx.arc(4, -2, 7, 0, TAU); ctx.fill();
    ctx.restore();

    var starPts = [[634, 1072, 4], [644, 1108, 3], [560, 1115, 3], [620, 1180, 2.5]];
    for (var si = 0; si < starPts.length; si++) {
      ctx.save(); ctx.translate(starPts[si][0], starPts[si][1]);
      starPath(ctx, 0, 0, starPts[si][2], 0);
      ctx.fillStyle = '#ffe9a8'; ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 2;
    ctx.fillStyle = '#9fc8ff';
    rr(ctx, 559, 1142, 7, 15, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#eef8ff';
    rr(ctx, 564, 1140, 15, 20, 6); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#9fc8ff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(568, 1158); ctx.lineTo(565, 1170); ctx.moveTo(576, 1158); ctx.lineTo(579, 1170); ctx.stroke();
    ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(564, 1172, 4, 2.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(580, 1172, 4, 2.5, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#eef8ff'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(564, 1146); ctx.lineTo(556, 1132); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(555, 1130, 3.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(572, 1129, 11, 0, TAU); ctx.fill(); ctx.stroke();
    var vg = ctx.createLinearGradient(565, 1124, 579, 1136);
    vg.addColorStop(0, '#7fe0ff'); vg.addColorStop(1, '#2f7bff');
    ctx.fillStyle = vg;
    ctx.beginPath(); ctx.ellipse(572, 1130, 7.5, 6, 0.1, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(569, 1127, 2.2, 1.5, -0.4, 0, TAU); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(604, 1136); ctx.lineTo(588, 1170); ctx.moveTo(604, 1136); ctx.lineTo(620, 1170); ctx.moveTo(604, 1136); ctx.lineTo(604, 1176); ctx.stroke();
    ctx.strokeStyle = '#9fc8ff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(604, 1136); ctx.lineTo(588, 1170); ctx.moveTo(604, 1136); ctx.lineTo(620, 1170); ctx.moveTo(604, 1136); ctx.lineTo(604, 1176); ctx.stroke();
    ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.moveTo(604, 1132); ctx.lineTo(629, 1087); ctx.stroke();
    var tg = ctx.createLinearGradient(604, 1132, 629, 1087);
    tg.addColorStop(0, '#7fe0ff'); tg.addColorStop(1, '#2f7bff');
    ctx.strokeStyle = tg; ctx.lineWidth = 14;
    ctx.beginPath(); ctx.moveTo(604, 1132); ctx.lineTo(629, 1087); ctx.stroke();
    ctx.fillStyle = '#0a1a33';
    ctx.beginPath(); ctx.arc(632, 1083, 10, 0, TAU); ctx.fill();
    var lg = ctx.createRadialGradient(629, 1080, 2, 632, 1083, 7);
    lg.addColorStop(0, '#ffffff'); lg.addColorStop(0.5, '#9fe8ff'); lg.addColorStop(1, '#2f7bff');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(632, 1083, 7, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(629, 1080, 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 1.5;
    rr(ctx, 595, 1136, 15, 8, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffd166'; ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(604, 1136, 5, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(614, 1106, 2.6, 0, TAU); ctx.arc(621, 1100, 2.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#0a1a33';
    ctx.beginPath(); ctx.arc(614.5, 1106, 1.1, 0, TAU); ctx.arc(621.5, 1100, 1.1, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#0a1a33'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(617.5, 1103, 3.2, 0.25, Math.PI - 0.25); ctx.stroke();
    ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(640, 1070); ctx.lineTo(640, 1076); ctx.moveTo(637, 1073); ctx.lineTo(643, 1073); ctx.stroke();
    ctx.restore();

    ctx.fillStyle = 'rgba(120,240,190,' + (0.4 + 0.3 * Math.sin(time * 2.4)).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(640, 1050, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawQuiz() {
    ctx.save();
    ctx.fillStyle = 'rgba(4,7,24,0.9)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 40px ' + FONT;
    ctx.fillStyle = '#ffe9a8';
    ctx.shadowColor = 'rgba(255,200,80,0.7)'; ctx.shadowBlur = 20;
    ctx.fillText('续命挑战', 360, 170);
    ctx.shadowBlur = 0;
    ctx.font = '500 18px ' + FONT;
    ctx.fillStyle = 'rgba(200,225,255,0.8)';
    ctx.fillText('答对 3 道题，续命 1 条', 360, 220);
    for (var d = 0; d < 3; d++) {
      ctx.fillStyle = d < quizIndex ? '#7bffb0' : (d === quizIndex ? '#ffe9a8' : 'rgba(255,255,255,0.15)');
      ctx.beginPath(); ctx.arc(330 + d * 30, 260, 6, 0, TAU); ctx.fill();
    }
    var q = quizList[quizIndex];
    if (!q) { ctx.restore(); return; }
    ctx.font = '700 23px ' + FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(q.q, 360, 330);
    for (var i = 0; i < 3; i++) {
      var y = 430 + i * 120;
      var correct = (quizFeedback !== 0 && i === q.a);
      var wrong = (quizFeedback === 2 && i === quizSel && i !== q.a);
      ctx.fillStyle = correct ? 'rgba(40,140,90,0.9)' : (wrong ? 'rgba(150,40,50,0.9)' : (i === quizSel ? 'rgba(30,70,140,0.9)' : 'rgba(12,28,62,0.9)'));
      rr(ctx, 60, y, 600, 86, 18); ctx.fill();
      ctx.strokeStyle = correct ? '#7bffb0' : (wrong ? '#ff8a9a' : (i === quizSel ? '#9fe8ff' : 'rgba(120,180,255,0.35)'));
      ctx.lineWidth = 2.5; ctx.stroke();
      ctx.font = '700 24px ' + FONT;
      ctx.fillStyle = correct ? '#eafff2' : (wrong ? '#ffe0e0' : '#dff2ff');
      ctx.fillText(['A. ', 'B. ', 'C. '][i] + q.opts[i], 360, y + 43);
    }
    ctx.font = '500 20px ' + FONT;
    if (quizFeedback === 1) { ctx.fillStyle = '#7bffb0'; ctx.fillText('答对了！', 360, 830); }
    else if (quizFeedback === 2) { ctx.fillStyle = '#ff9a9a'; ctx.fillText('答错了，正确答案是：' + q.opts[q.a], 360, 830); }
    else { ctx.fillStyle = 'rgba(160,200,240,0.55)'; ctx.fillText('点选项作答 · 也可以按 1 / 2 / 3', 360, 830); }
    ctx.restore();
  }

  function drawCombo() {
    if (state !== 'playing' || comboT <= 0 || combo < 2) return;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var a = Math.min(1, comboT / 0.4);
    ctx.globalAlpha = a;
    ctx.font = '800 24px ' + FONT;
    ctx.fillStyle = combo >= 10 ? '#ffe066' : '#9fe8ff';
    ctx.shadowColor = combo >= 10 ? 'rgba(255,200,80,0.8)' : 'rgba(80,180,255,0.8)';
    ctx.shadowBlur = 14;
    ctx.fillText('连击 x' + combo, 360, 240);
    ctx.restore();
  }

  function drawLightStrips() {
    var active = lightT > 0;
    var fade = active ? Math.min(1, (3.5 - lightT) / 0.25) * Math.min(1, lightT / 0.5) : 0;
    if (fade < 0) fade = 0;
    var i, x, y, w, h, col, a;
    ctx.save();
    if (!active || fade <= 0.01) {
      ctx.fillStyle = 'rgba(70,110,170,0.3)';
      for (i = 0; i < 16; i++) {
        if (i < 6) { x = 56 + i * 100; y = 102; w = 86; h = 9; }
        else if (i < 10) { x = 42; y = 120 + (i - 6) * 210; w = 9; h = 190; }
        else if (i < 14) { x = 649; y = 120 + (i - 10) * 210; w = 9; h = 190; }
        else { x = 250 + (i - 14) * 120; y = 1191; w = 86; h = 9; }
        rr(ctx, x, y, w, h, 3); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(70,110,170,0.25)';
      ctx.lineWidth = 3;
      rr(ctx, 42, 102, 616, 1098, 18); ctx.stroke();
      ctx.restore();
      return;
    }
    for (i = 0; i < 16; i++) {
      if (i < 6) { x = 56 + i * 100; y = 102; w = 86; h = 9; }
      else if (i < 10) { x = 42; y = 120 + (i - 6) * 210; w = 9; h = 190; }
      else if (i < 14) { x = 649; y = 120 + (i - 10) * 210; w = 9; h = 190; }
      else { x = 250 + (i - 14) * 120; y = 1191; w = 86; h = 9; }
      if (lightMode === 0) {
        col = 'hsl(' + ((i * 22 + time * 120) % 360) + ',100%,62%)';
        a = 0.95 * fade;
      } else if (lightMode === 1) {
        col = 'hsl(190,100%,65%)';
        a = (0.55 + 0.4 * (0.5 + 0.5 * Math.sin(time * 4 - i * 0.4))) * fade;
      } else {
        col = 'hsl(45,100%,62%)';
        a = (0.55 + 0.4 * (0.5 + 0.5 * Math.sin(time * 2.5 + i * 0.25))) * fade;
      }
      ctx.globalAlpha = Math.min(1, a);
      ctx.shadowColor = col;
      ctx.shadowBlur = 18;
      ctx.fillStyle = col;
      rr(ctx, x, y, w, h, 3); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }
    var borderCol = lightMode === 0 ? 'hsl(' + ((time * 80) % 360) + ',100%,65%)' : (lightMode === 1 ? 'hsl(190,100%,65%)' : 'hsl(45,100%,62%)');
    ctx.globalAlpha = 0.85 * fade;
    ctx.strokeStyle = borderCol;
    ctx.shadowColor = borderCol;
    ctx.shadowBlur = 20;
    ctx.lineWidth = 3.5;
    rr(ctx, 42, 102, 616, 1098, 18); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawSoundHint() {
    var msg = '';
    if (muted) msg = '声音已关闭，点右上角开启';
    else if (!audioCtx || audioCtx.state !== 'running') msg = '点一下屏幕开启声音';
    if (!msg) return;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 16px ' + FONT;
    ctx.fillStyle = 'rgba(255,210,120,0.95)';
    ctx.shadowColor = 'rgba(255,160,60,0.7)'; ctx.shadowBlur = 10;
    ctx.fillText(msg, 360, 1000);
    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var pg = ctx.createRadialGradient(viewW / 2, viewH / 2, 40, viewW / 2, viewH / 2, Math.max(viewW, viewH) * 0.8);
    pg.addColorStop(0, '#0a1233'); pg.addColorStop(1, '#04050f');
    ctx.fillStyle = pg; ctx.fillRect(0, 0, viewW, viewH);
    for (var ps = 0; ps < pageStars.length; ps++) {
      var st = pageStars[ps];
      ctx.globalAlpha = st.a; ctx.fillStyle = '#cfe4ff';
      ctx.beginPath(); ctx.arc(st.x * viewW, st.y * viewH, st.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, offX * dpr, offY * dpr);
    ctx.drawImage(bg, 0, 0, W, H);
    drawGuides();
    drawSprings();
    drawSolar();
    drawSideDecor();
    drawPipe();
    drawLightStrips();
    drawFlippers();
    drawBall();
    drawParticles();
    drawFloaters();
    drawHUD();
    drawCombo();
    drawKnowledgeCard();
    drawProgress();
    drawPadIcon();
    drawCheer();
    drawReadyHint();
    if (state === 'menu') drawMenu();
    if (state === 'over') drawOver();
    if (state === 'quiz') drawQuiz();
    drawSoundHint();
    drawPadToast();
    drawMute();
  }

  var lastTs = 0;
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (!isFinite(dt) || dt < 0) dt = 0;
    dt = Math.min(dt, 0.05);
    time += dt;
    pollGamepad();
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
<script>
(function () {
  'use strict';
  var isHttp = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  var ua = navigator.userAgent || '';
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  var rotateEl = document.getElementById('rotate');
  var rotateDismissed = false;
  function updateRotate() {
    if (!rotateEl) return;
    var touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var landscape = window.innerWidth > window.innerHeight;
    if (touch && landscape && !rotateDismissed) rotateEl.classList.add('show');
    else rotateEl.classList.remove('show');
  }
  var rotateClose = document.getElementById('rotate-close');
  if (rotateClose) rotateClose.addEventListener('click', function () { rotateDismissed = true; updateRotate(); });
  window.addEventListener('resize', updateRotate);
  window.addEventListener('orientationchange', function () { setTimeout(updateRotate, 250); });
  updateRotate();

  var hintEl = document.getElementById('install-hint');
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var hintDismissed = false;
  try { hintDismissed = localStorage.getItem('spacePinball.installHint') === '1'; } catch (e) {}
  if (hintEl && isIOS && !standalone && isHttp && !hintDismissed) hintEl.classList.add('show');
  var hintClose = document.getElementById('install-close');
  if (hintClose) hintClose.addEventListener('click', function () {
    if (hintEl) hintEl.classList.remove('show');
    try { localStorage.setItem('spacePinball.installHint', '1'); } catch (e) {}
  });

  if ('serviceWorker' in navigator && isHttp) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
